name: Build mod
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q "$(ls *.zip | head -1)" -d project
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
      - run: gradle build --stacktrace -p project
      - uses: actions/upload-artifact@v4
        with:
          name: juliusschneider-auction-mod
          path: |
            project/build/libs/*.jar
            !project/build/libs/*-sources.jar
